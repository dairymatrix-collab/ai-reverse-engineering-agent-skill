name: Feature request
description: Suggest a portable workflow, evidence improvement, or test fixture
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What authorized workflow needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the safe, portable change.
    validations:
      required: true
